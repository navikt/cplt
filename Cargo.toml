[package]
name = "cplt"
version = "0.0.0"
edition = "2024"
description = "Sandbox wrapper for GitHub Copilot CLI (macOS Seatbelt, Linux Landlock)"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
directories = "6.0.0"
libc = "0.2"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_ignored = "0.1"
serde_json = "1"
sha2 = { version = "0.11.0", default-features = false }
thiserror = "2.0.18"
toml = "1.1"
toml_edit = "0.25"

# Linux-only: Landlock LSM crate (only compiled and linked on Linux).
# Run `cargo update` with network access to populate the lockfile.
[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"

[profile.release]
strip = true
lto = true

[dev-dependencies]
temp-env = "0.3"
tempfile = "3"

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allow patterns that are idiomatic in this codebase or too noisy:
missing_errors_doc = "allow"          # 25+ public Result-returning fns
missing_panics_doc = "allow"          # sandbox code intentionally panics on invariant violations
module_name_repetitions = "allow"     # e.g. config::ConfigError is clear
too_many_lines = "allow"              # long functions are sometimes clearer than forced splits
must_use_candidate = "allow"          # too noisy — we add #[must_use] manually where it matters
doc_markdown = "allow"                # backtick-wrapping every identifier is excessive
struct_excessive_bools = "allow"      # Config/CliFlags legitimately use many bools
cast_possible_truncation = "allow"    # date math and exit code conversions are bounded
cast_sign_loss = "allow"              # date math conversions are bounded
cast_possible_wrap = "allow"          # date math conversions are bounded
unreadable_literal = "allow"          # calendar algorithm constants (146097, 719468)
items_after_statements = "allow"      # local helper fns after setup are clear
many_single_char_names = "allow"      # date destructuring (y, m, d, h, s)
needless_pass_by_value = "allow"      # Arc<T> params in proxy threads need owned values
match_same_arms = "allow"             # explicit per-variant arms document intent
trivially_copy_pass_by_ref = "allow"  # small IP-address helper fns are fine with &
case_sensitive_file_extension_comparisons = "allow" # domain names are not file paths
comparison_chain = "allow"            # if/else-if date comparisons are clearer than match
fn_params_excessive_bools = "allow"   # some functions legitimately take multiple bool flags
similar_names = "allow"               # domain-specific names (e.g. current/latest) are clear
manual_string_new = "allow"           # String::new() vs "".to_string() are both fine
format_collect = "allow"              # hex formatting via map(format!).collect() is idiomatic
unnested_or_patterns = "allow"        # explicit arms with comments are clearer for magic bytes
