name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Unit tests run on Linux (fast, no macOS dependency)
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # ratchet:actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit and lib tests
        run: cargo test --test unit_tests --lib --verbose

  # Integration tests need macOS for sandbox-exec
  integration-tests:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - name: Cache cargo registry and build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # ratchet:actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Verify sandbox-exec available
        run: |
          which sandbox-exec
          sandbox-exec -p '(version 1)(allow default)' /usr/bin/true

      - name: Install Java (for JVM integration tests)
        uses: actions/setup-java@ad2b38190b15e4d6bdf0c97fb4fca8412226d287 # ratchet:actions/setup-java@v5.3.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Gradle (for Gradle sandbox tests)
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # ratchet:gradle/actions/setup-gradle@v6.2.0

      - name: Run all tests
        run: cargo test --verbose

  # Linux integration tests — Landlock kernel enforcement (requires Linux 5.13+)
  linux-integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - name: Cache cargo registry and build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # ratchet:actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: Linux-integration-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: Linux-integration-cargo-

      - name: Verify Landlock availability
        id: landlock
        run: |
          echo "Kernel: $(uname -r)"

          if [ ! -r /sys/kernel/security/lsm ]; then
            echo "::warning::securityfs not readable — Landlock tests will be skipped by require_landlock!()"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          lsm="$(cat /sys/kernel/security/lsm)"
          echo "LSM: $lsm"

          if ! printf '%s\n' "$lsm" | grep -qw landlock; then
            echo "::warning::Landlock not in LSM list — tests will be skipped by require_landlock!()"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ ! -r /sys/kernel/security/landlock/abi_version ]; then
            echo "::warning::Landlock in LSM but abi_version not readable (securityfs may not be fully mounted)"
            echo "::warning::Tests will still run — require_landlock!() skips individual tests at runtime"
            echo "available=partial" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Landlock ABI: $(cat /sys/kernel/security/landlock/abi_version)"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Run all Linux tests
        run: cargo test --verbose

  # Build test binaries on PRs — downloadable from the workflow run page.
  # Lets testers try changes without installing the Rust toolchain.
  build-test-binaries:
    if: github.event_name == 'pull_request'
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # ratchet:actions/cache@v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pr-build-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pr-build-${{ matrix.target }}-

      - name: Build release binary
        run: |
          SHORT_SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          VERSION="pr${{ github.event.pull_request.number }}-${SHORT_SHA}"
          CPLT_LONG_VERSION="$VERSION" cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../cplt-${{ matrix.target }}.tar.gz cplt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: cplt-${{ matrix.target }}
          path: cplt-${{ matrix.target }}.tar.gz
          retention-days: 7
