name: CI

on:
  push:
    branches: [main]
  # Deliberately unfiltered by base branch. `branches: [main]` filters on a
  # PR's BASE, so a PR stacked on another feature branch got no CI at all — no
  # ci-ok, no unit tests. The `stack branches` ruleset requires ci-ok on
  # `stack/**` bases, which under a base filter is unsatisfiable by
  # construction: the check can never report, so the PR sits blocked forever.
  # Listing prefixes instead (`stack/**`) would only move the hole to ad-hoc
  # stacks (#354 is based on `fix/...`), so every PR gets checked regardless of
  # base. Cost is one run per stacked PR; the concurrency group below keys on
  # `github.ref`, which for a PR is `refs/pull/<n>/merge` — unique per PR — so a
  # stack rebasing at once runs in parallel and each PR only cancels its own
  # older runs.
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # Run the required checks on the merge queue's temporary ref. The ruleset
  # requires unit-tests / integration-tests / linux-integration-tests before
  # merge; without this trigger those checks never report in the merge_group
  # context, so queued entries wait until the 60-min timeout and fail to merge.
  merge_group:
  workflow_dispatch:

concurrency:
  # Body/title-only edits (`pull_request` + `edited` with no base-branch change)
  # run in a separate `-body` concurrency group so fixing a PR description never
  # cancels an in-progress 6-minute test run (#769).
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base) && 'body' || 'code' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  pr-body-check:
    name: PR body template check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Validate PR description against template
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 -B hack/check-pr-body.py --fetch-live

  # Unit tests run on Linux (fast, no macOS dependency)
  unit-tests:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Run offline probe checks
        run: python3 --version && python3 -B hack/test-probe-copilot-no-auth.py && python3 -B hack/test-probe-copilot-auth-contract.py && python3 -B hack/test-probe-linux-secret-service.py && python3 -B hack/test-check-pr-body.py

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit and lib tests
        # --no-fail-fast: cargo stops at the first *target* that fails, so a
        # broken lib assertion hides every integration test behind it. Two
        # mutation-testing rounds were scored against suites that never ran for
        # exactly that reason (issue #126). Failures still fail the job.
        shell: bash
        run: |
          set -o pipefail
          cargo test --no-fail-fast --test unit_tests --lib --verbose 2>&1 | tee "$RUNNER_TEMP/test-output.log"

      - name: Annotate failing tests
        if: failure()
        shell: bash
        run: |
          # Print each failing test name as an annotation, so a flake is not
          # lost in a long log (#528). The awk half reads the indented names
          # under libtest's closing `failures:` list, which --nocapture keeps
          # when it drops the `---- name stdout ----` headers.
          LOG="$RUNNER_TEMP/test-output.log"
          [ -f "$LOG" ] || exit 0
          {
            sed -nE -e 's/^test (.*) \.\.\. FAILED$/\1/p' -e 's/^---- (.*) stdout ----$/\1/p' "$LOG"
            awk '/^failures:$/ { s = 1; next }
                 s == 1 && /^$/ { next }
                 s == 1 && /^    [^ ]/ { s = 2 }
                 s == 1 { s = 0; next }
                 s == 2 && /^    [^ ]/ { sub(/^    /, ""); print; next }
                 { s = 0 }' "$LOG"
          } | sort -u | sed 's/^/::error::Test failed: /'

  # Integration tests need macOS for sandbox-exec
  integration-tests:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install pinned Chrome for Testing
        shell: bash
        run: |
          set -euo pipefail
          playwright_version="1.63.0-alpha-2026-08-31"
          browser_root="$HOME/Library/Caches/ms-playwright/cplt-ci-$playwright_version"
          PLAYWRIGHT_BROWSERS_PATH="$browser_root" \
            npx --yes "playwright@$playwright_version" install chromium

          chrome_paths=()
          while IFS= read -r path; do
            chrome_paths+=("$path")
          done < <(
            find "$browser_root" -type f \
              -path '*/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing' \
              -perm -111 -print
          )
          if [ "${#chrome_paths[@]}" -ne 1 ]; then
            echo "::error::Pinned Playwright install must provide exactly one Chrome for Testing executable"
            exit 1
          fi
          chrome_path="${chrome_paths[0]}"
          case "$chrome_path" in
            "$browser_root"/*"/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing") ;;
            *)
              echo "::error::Discovered browser path is not the expected Chrome for Testing executable"
              exit 1
              ;;
          esac
          if [ ! -x "$chrome_path" ]; then
            echo "::error::Discovered Chrome for Testing file is not executable"
            exit 1
          fi
          printf 'CPLT_CHROME_FOR_TESTING=%s\n' "$chrome_path" >> "$GITHUB_ENV"

      - name: Verify sandbox-exec available
        run: |
          which sandbox-exec
          sandbox-exec -p '(version 1)(allow default)' /usr/bin/true

      - name: Run offline probe checks
        run: python3 --version && python3 -B hack/test-probe-copilot-no-auth.py && python3 -B hack/test-probe-copilot-auth-contract.py && python3 -B hack/test-probe-linux-secret-service.py && python3 -B hack/test-check-pr-body.py

      - name: Install Java (for JVM integration tests)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # ratchet:actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Gradle (for Gradle sandbox tests)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # ratchet:gradle/actions/setup-gradle@v6.4.0

      - name: Install .NET SDK (for MSBuild sandbox tests)
        # macos-latest is an arm64 runner. Without this, the dotnet e2e test falls
        # back to whatever's pre-baked into the runner image at /usr/local/bin —
        # historically an x64 build needing Rosetta translation, which a sandboxed
        # process can't complete (`Operation not permitted` on exec, before the
        # MSBuild worker-node socket rule is ever reached). Installing an
        # arch-native SDK here sidesteps that. It lands under $DOTNET_ROOT in
        # ~/hostedtoolcache, which the sandbox separately allowlists for
        # read/dylib access (see emit_dotnet_root in sandbox_profile.rs).
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # ratchet:actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Run all tests (skips fail the job)
        # --no-fail-fast: cargo stops at the first *target* that fails, so a
        # broken lib assertion hides every integration test behind it. Two
        # mutation-testing rounds were scored against suites that never ran for
        # exactly that reason (issue #126). Failures still fail the job.
        # CPLT_TEST_REQUIRE_SANDBOX=1 makes require_sandbox! panic instead of skip,
        # so a missing/broken sandbox-exec (a Seatbelt regression on the runner)
        # turns this job red rather than silently passing while nothing is
        # enforced — the macOS analogue of the Linux job's execute-or-fail guard
        # (issue #115). sandbox-exec is always present on macos-latest, so this is
        # safe to require. Output is teed (with pipefail) to a log outside the
        # workspace so the skip-summary step below can count residual skips without
        # dirtying the working tree; a real test failure still fails the pipeline.
        env:
          CPLT_TEST_REQUIRE_SANDBOX: "1"
        shell: bash
        run: |
          set -o pipefail
          cargo test --no-fail-fast --verbose -- --nocapture 2>&1 | tee "$RUNNER_TEMP/test-output.log"

      - name: Annotate failing tests
        if: failure()
        shell: bash
        run: |
          # Print each failing test name as an annotation, so a flake is not
          # lost in a long log (#528). The awk half reads the indented names
          # under libtest's closing `failures:` list, which --nocapture keeps
          # when it drops the `---- name stdout ----` headers.
          LOG="$RUNNER_TEMP/test-output.log"
          [ -f "$LOG" ] || exit 0
          {
            sed -nE -e 's/^test (.*) \.\.\. FAILED$/\1/p' -e 's/^---- (.*) stdout ----$/\1/p' "$LOG"
            awk '/^failures:$/ { s = 1; next }
                 s == 1 && /^$/ { next }
                 s == 1 && /^    [^ ]/ { s = 2 }
                 s == 1 { s = 0; next }
                 s == 2 && /^    [^ ]/ { sub(/^    /, ""); print; next }
                 { s = 0 }' "$LOG"
          } | sort -u | sed 's/^/::error::Test failed: /'

      - name: Surface tests skipped for missing tooling
        if: always()
        shell: bash
        run: |
          # Copilot cannot be installed/authed in CI, so tests that genuinely need
          # the real Copilot binary self-skip with a `SKIPPED (copilot):` marker.
          # cargo hides passing-test stderr, so we run with --nocapture above and
          # count the markers here, surfacing the residual (unrunnable-in-CI) count
          # as a ::warning:: so a silent-skip regression stays observable (#115).
          # Chrome for Testing is installed above, so its distinct marker is a
          # setup/test regression and must fail this job.
          LOG="$RUNNER_TEMP/test-output.log"
          if [ ! -f "$LOG" ]; then
            echo "No test output captured — skipping summary"
            exit 0
          fi
          copilot_skips=$(grep -c "SKIPPED (copilot)" "$LOG" || true)
          chrome_skips=$(grep -c "SKIPPED (chrome-for-testing):" "$LOG" || true)
          echo "Copilot-gated tests skipped (Copilot not installed in CI): $copilot_skips"
          if [ "$copilot_skips" -gt 0 ]; then
            echo "::warning::${copilot_skips} E2E test(s) skipped because the real Copilot CLI is not installed in CI. These genuinely require the Copilot binary/auth (see require_copilot! in tests/e2e.rs); all sandbox/proxy/profile behaviour is covered without it."
          fi
          echo "Chrome for Testing integration tests skipped: $chrome_skips"
          if [ "$chrome_skips" -gt 0 ]; then
            echo "::error::${chrome_skips} Chrome for Testing integration test(s) skipped despite the pinned CI browser setup."
            exit 1
          fi

      - name: Assert working tree is clean (no leaked test artifacts)
        run: |
          # E2E/integration tests must scaffold fixtures into TempDir-scoped
          # locations that auto-delete on drop. Any leftover here means a test
          # wrote into the checkout and failed to clean up — fail the job so the
          # invariant is enforced (issue #112).
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty after tests — a test leaked artifacts into the repo:"
            git status --porcelain
            exit 1
          fi
          echo "Working tree clean — no test artifacts leaked"

  # OpenCode v2 (#710) through cplt with the real, pinned binary and no
  # credentials. The integration job covers the same ground with a stub; this
  # checks the real client finds and reaches its own per-session service.
  opencode-v2-e2e:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install pinned OpenCode v2
        shell: bash
        run: |
          set -euo pipefail
          # The platform package carries the binary; the @opencode/cli shim
          # only links it from a postinstall script, which stays off.
          prefix="$RUNNER_TEMP/opencode-v2"
          npm install --ignore-scripts --no-save --prefix "$prefix" "@opencode/cli-darwin-arm64@2.0.24"
          bin="$prefix/node_modules/@opencode/cli-darwin-arm64/bin/opencode"
          "$bin" --version
          echo "CPLT_E2E_OPENCODE_V2=$bin" >> "$GITHUB_ENV"

      - name: Run OpenCode v2 e2e tests
        env:
          CPLT_TEST_REQUIRE_SANDBOX: "1"
        shell: bash
        run: |
          set -o pipefail
          cargo test --test e2e opencode_v2 -- --nocapture 2>&1 | tee "$RUNNER_TEMP/test-output.log"
          if grep -q "SKIPPED (opencode v2)" "$RUNNER_TEMP/test-output.log"; then
            echo "::error::OpenCode v2 tests skipped although the binary is installed"
            exit 1
          fi

  # The same on Linux (#719): v2 needs bubblewrap, and is refused without it.
  opencode-v2-e2e-linux:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: Linux-integration-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: Linux-integration-cargo-

      - name: Install bubblewrap and enable unprivileged user namespaces
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Same as linux-integration-tests: Ubuntu 24.04's AppArmor userns
          # restriction blocks unprivileged bwrap.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc --dev /dev --tmpfs /tmp /bin/true

      - name: Install pinned OpenCode v2
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/opencode-v2"
          npm install --ignore-scripts --no-save --prefix "$prefix" "@opencode/cli-linux-x64@2.0.24"
          bin="$prefix/node_modules/@opencode/cli-linux-x64/bin/opencode"
          "$bin" --version
          echo "CPLT_E2E_OPENCODE_V2=$bin" >> "$GITHUB_ENV"

      - name: Run OpenCode v2 e2e tests
        env:
          CPLT_TEST_REQUIRE_SANDBOX: "1"
        shell: bash
        run: |
          set -eo pipefail
          cargo test --test integration_linux opencode_v2 -- --nocapture 2>&1 | tee "$RUNNER_TEMP/test-output.log"
          if grep -q "SKIPPED (opencode v2)" "$RUNNER_TEMP/test-output.log"; then
            echo "::error::OpenCode v2 tests skipped although the binary is installed"
            exit 1
          fi

  # MCP host broker (#834) with real bubblewrap on both supported Ubuntu
  # LTS releases. 24.04 gets the AppArmor profile users are told to install,
  # not the sysctl, so the documented fix is what CI measures.
  mcp-broker-e2e:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    name: mcp-broker-e2e-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-mcp-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-mcp-cargo-

      - name: Install bubblewrap (and the AppArmor userns profile where needed)
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # The fix cplt prints (src/doctor.rs, apparmor_fix_text): Ubuntu's own
          # profile when shipped, else a written one.
          if [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = "1" ] \
            && [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
            sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          elif [ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" = "1" ]; then
            sudo tee /etc/apparmor.d/bwrap >/dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi
          bwrap --unshare-user --unshare-pid --ro-bind / / --proc /proc --dev /dev --tmpfs /tmp /bin/true

      - name: Install a session bus
        run: sudo apt-get install -y dbus

      - name: Run the MCP broker e2e under a real session bus
        env:
          CPLT_TEST_REQUIRE_SANDBOX: "1"
          CPLT_TEST_REQUIRE_SESSION_BUS: "1"
        run: |
          # A path socket outside /tmp, so the bus masks are what hides it,
          # not the private /tmp.
          sed "s|<listen>.*</listen>|<listen>unix:path=$HOME/cplt-ci-session-bus</listen>|" \
            /usr/share/dbus-1/session.conf > "$RUNNER_TEMP/session.conf"
          cargo build --test mcp_broker
          dbus-run-session --config-file="$RUNNER_TEMP/session.conf" -- \
            sh -c 'echo "bus: $DBUS_SESSION_BUS_ADDRESS"; cargo test --test mcp_broker -- --nocapture'

  # `cplt doctor --fix` (#841) on a stock 24.04 runner: the AppArmor userns
  # block is live, the fix runs through the runner's passwordless sudo in a
  # real TTY, and every refusal runs nothing.
  doctor-fix-e2e:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ubuntu-24.04-doctor-fix-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ubuntu-24.04-doctor-fix-cargo-

      - name: Build cplt
        run: cargo build

      - name: Install bubblewrap and assert the userns block is live
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          test "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" = 1
          if bwrap --unshare-user --ro-bind / / /bin/true; then
            echo "::error::bwrap --unshare-user works before the fix; nothing to test"
            exit 1
          fi
          echo "userns block live: bwrap --unshare-user fails"
          ls -l /etc/apparmor.d/ | grep -i bwrap || echo "no bwrap profile in /etc/apparmor.d"

      - name: Refusals print the commands and run nothing
        run: |
          set -u
          cplt="$PWD/target/debug/cplt"
          blocked() { ! bwrap --unshare-user --ro-bind / / /bin/true 2>/dev/null; }
          check() { # name, output
            echo "--- $1"; echo "$2" | tail -40
            echo "$2" | grep -q 'sudo apparmor_parser -r /etc/apparmor.d/bwrap' || { echo "::error::$1: commands not shown"; exit 1; }
            echo "$2" | grep -q "Not offering to run it" || { echo "::error::$1: no refusal"; exit 1; }
            echo "$2" | grep -q "Fix now?" && { echo "::error::$1: it asked"; exit 1; }
            blocked || { echo "::error::$1: the fix ran"; exit 1; }
          }
          check "--yes in a TTY" "$(printf 'y\n' | env -u CI script -q -e -c "$cplt --yes doctor --fix" /dev/null 2>&1 || true)"
          check "non-TTY" "$(printf 'y\n' | env -u CI "$cplt" doctor --fix 2>&1 || true)"
          check "CI set" "$(printf 'y\n' | CI=true script -q -e -c "$cplt doctor --fix" /dev/null 2>&1 || true)"
          check "inside cplt" "$(printf 'y\n' | env -u CI __CPLT_WRAPPED=1 script -q -e -c "$cplt doctor --fix" /dev/null 2>&1 || true)"

      - name: doctor --fix in a real TTY applies the fix
        run: |
          out="$(printf 'y\n' | env -u CI script -q -e -c "$PWD/target/debug/cplt doctor --fix" /dev/null 2>&1 || true)"
          echo "$out" | tail -40
          echo "$out" | grep -q "Fix now?" || { echo "::error::not offered"; exit 1; }
          echo "$out" | grep -q "Fixed: bubblewrap now starts." || { echo "::error::re-check did not pass"; exit 1; }
          bwrap --unshare-user --ro-bind / / /bin/true
          echo "after the fix: bwrap --unshare-user succeeds"

  # Linux integration tests — Landlock kernel enforcement (requires Linux 5.13+)
  linux-integration-tests:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: Linux-integration-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: Linux-integration-cargo-

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap

      - name: Enable unprivileged user namespaces
        run: |
          # Ubuntu 23.10+ (incl. ubuntu-latest = 24.04) restricts unprivileged
          # user namespaces via AppArmor, which blocks unprivileged bwrap. Clear
          # the knob so bwrap can create namespaces. Guarded so the step does not
          # fail on images where the sysctl does not exist — the functional probe
          # below is the real gate.
          if sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0; then
            echo "Disabled apparmor_restrict_unprivileged_userns"
          else
            echo "sysctl kernel.apparmor_restrict_unprivileged_userns not present — skipping"
          fi

      - name: Verify sandbox capabilities
        run: |
          echo "Kernel: $(uname -r)"

          if [ -r /sys/kernel/security/lsm ]; then
            echo "LSM: $(cat /sys/kernel/security/lsm)"
          else
            echo "::warning::securityfs not readable"
          fi

          if [ -r /sys/kernel/security/landlock/abi_version ]; then
            echo "Landlock ABI: $(cat /sys/kernel/security/landlock/abi_version)"
          else
            # securityfs is root-only on GitHub runners; the tests probe the
            # ABI via the landlock_create_ruleset syscall instead, so this is
            # informational only.
            echo "Landlock abi_version not readable via securityfs (expected on GitHub runners)"
          fi

          echo "bwrap: $(bwrap --version)"

          # Functional bwrap probe with the exact namespace set cplt uses. If
          # this fails the whole job fails — CPLT_TEST_REQUIRE_SANDBOX below
          # then also turns every skipped sandbox test into a hard failure.
          bwrap --unshare-user --unshare-pid \
            --ro-bind / / --proc /proc --dev /dev --tmpfs /tmp \
            /bin/true
          echo "bwrap functional probe: OK"

      - name: Start privileged 127.0.0.1:443 listener (proxy-forced enforcement e2e)
        # --proxy-forced drops the Landlock :443 allow. A listener on the
        # privileged port 443 lets proxy_forced_kernel_blocks_direct_443 OBSERVE
        # that a direct :443 connect is kernel-blocked under forced mode but
        # allowed by default — a fully local, hermetic differential (no external
        # network). Runs as a transient systemd unit so it survives to the test
        # step; binding :443 needs root (runners have passwordless sudo).
        run: |
          cat > /tmp/listen443.py <<'PY'
          import socket
          s = socket.socket()
          s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          s.bind(("127.0.0.1", 443))
          s.listen(128)
          while True:
              c, _ = s.accept()
              try:
                  c.sendall(b"HELLO443\n")
              finally:
                  c.close()
          PY
          sudo systemd-run --unit=cplt-e2e-443 --collect python3 -u /tmp/listen443.py
          # Wait until reachable; fail the step (not the test) if it never binds.
          for _ in $(seq 1 50); do
            if (exec 3<>/dev/tcp/127.0.0.1/443) 2>/dev/null; then
              echo "127.0.0.1:443 listener up"; exit 0
            fi
            sleep 0.2
          done
          echo "::error::127.0.0.1:443 listener did not come up"
          sudo journalctl -u cplt-e2e-443 --no-pager | tail -20 || true
          exit 1

      - name: Run all Linux tests (skips fail the job)
        # --no-fail-fast: cargo stops at the first *target* that fails, so a
        # broken lib assertion hides every integration test behind it. Two
        # mutation-testing rounds were scored against suites that never ran for
        # exactly that reason (issue #126). Failures still fail the job.
        # CPLT_TEST_REQUIRE_SANDBOX=1 makes require_landlock!/require_bwrap!/
        # require_curl! panic instead of skip, so a missing capability (e.g.
        # bubblewrap uninstalled — issue #113) turns this job red rather than
        # silently passing. CPLT_TEST_PRIV_443=1 tells the proxy-forced
        # enforcement test that the privileged :443 listener above is available,
        # so it runs (and, under require-mode, fails if the listener is missing).
        env:
          CPLT_TEST_REQUIRE_SANDBOX: "1"
          CPLT_TEST_PRIV_443: "1"
        shell: bash
        run: |
          set -o pipefail
          cargo test --no-fail-fast --verbose 2>&1 | tee "$RUNNER_TEMP/test-output.log"

      - name: Annotate failing tests
        if: failure()
        shell: bash
        run: |
          # Print each failing test name as an annotation, so a flake is not
          # lost in a long log (#528). The awk half reads the indented names
          # under libtest's closing `failures:` list, which --nocapture keeps
          # when it drops the `---- name stdout ----` headers.
          LOG="$RUNNER_TEMP/test-output.log"
          [ -f "$LOG" ] || exit 0
          {
            sed -nE -e 's/^test (.*) \.\.\. FAILED$/\1/p' -e 's/^---- (.*) stdout ----$/\1/p' "$LOG"
            awk '/^failures:$/ { s = 1; next }
                 s == 1 && /^$/ { next }
                 s == 1 && /^    [^ ]/ { s = 2 }
                 s == 1 { s = 0; next }
                 s == 2 && /^    [^ ]/ { sub(/^    /, ""); print; next }
                 { s = 0 }' "$LOG"
          } | sort -u | sed 's/^/::error::Test failed: /'

      - name: Stop 127.0.0.1:443 listener
        if: always()
        run: sudo systemctl stop cplt-e2e-443 2>/dev/null || true

      - name: Assert working tree is clean (no leaked test artifacts)
        run: |
          # E2E/integration tests must scaffold fixtures into TempDir-scoped
          # locations that auto-delete on drop. Any leftover here means a test
          # wrote into the checkout and failed to clean up — fail the job so the
          # invariant is enforced (issue #112).
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Working tree is dirty after tests — a test leaked artifacts into the repo:"
            git status --porcelain
            exit 1
          fi
          echo "Working tree clean — no test artifacts leaked"

  # Build test binaries on PRs — downloadable from the workflow run page.
  # Lets testers try changes without installing the Rust toolchain.
  build-test-binaries:
    if: github.event_name == 'pull_request' && (github.event.action != 'edited' || github.event.changes.base != null)
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pr-build-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pr-build-${{ matrix.target }}-

      - name: Build release binary
        run: |
          SHORT_SHA="${{ github.event.pull_request.head.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          VERSION="pr${{ github.event.pull_request.number }}-${SHORT_SHA}"
          CPLT_LONG_VERSION="$VERSION" cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../cplt-${{ matrix.target }}.tar.gz cplt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # ratchet:actions/upload-artifact@v7.0.2
        with:
          name: cplt-${{ matrix.target }}
          path: cplt-${{ matrix.target }}.tar.gz
          retention-days: 7

  # Single aggregate gate for branch-protection / merge-queue. Set THIS check
  # (context name: ci-ok) as the SOLE required status check in the ruleset,
  # instead of listing each job. Then adding/renaming/removing a CI job never
  # needs a ruleset (admin) edit, and a renamed required check can't silently
  # stop being enforced. Runs on pull_request and merge_group (inherited from
  # this workflow's `on:`), so it gates both PRs and queue entries.
  ci-ok:
    name: ci-ok
    if: ${{ always() }}
    needs: [pr-body-check, unit-tests, integration-tests, opencode-v2-e2e, opencode-v2-e2e-linux, linux-integration-tests, mcp-broker-e2e, doctor-fix-e2e]
    runs-on: ubuntu-latest
    # Body-edit runs wait for the code run's tests (CI_OK_WAIT_SECONDS below).
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Require all gating jobs to have succeeded
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          BASE_CHANGED: ${{ github.event.changes.base != null }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_OK_WAIT_SECONDS: "1500"
          BODY_RESULT: ${{ needs.pr-body-check.result }}
          CODE_RESULTS: ${{ format('{0},{1},{2},{3},{4},{5},{6}', needs.unit-tests.result, needs.integration-tests.result, needs.opencode-v2-e2e.result, needs.opencode-v2-e2e-linux.result, needs.linux-integration-tests.result, needs.mcp-broker-e2e.result, needs.doctor-fix-e2e.result) }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$EVENT_ACTION" = "edited" ] && [ "$BASE_CHANGED" = "false" ]; then
            if [ "$BODY_RESULT" != "success" ]; then
              echo "::error::ci-ok: PR body template check did not succeed (result: $BODY_RESULT)"
              exit 1
            fi
            python3 -B hack/check-pr-body.py --fetch-live --verify-code-checks
            exit 0
          fi

          echo "gating code job results: $CODE_RESULTS"
          for r in $(echo "$CODE_RESULTS" | tr ',' ' '); do
            if [ "$r" != "success" ]; then
              echo "::error::ci-ok: a required job did not succeed (result: $r)"
              exit 1
            fi
          done
          python3 -B hack/check-pr-body.py --fetch-live
          echo "ci-ok: all required jobs succeeded"
