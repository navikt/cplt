name: CodeQL

# Advanced CodeQL setup, replacing the repository's *default* setup.
#
# Why: the branch ruleset has a `code_scanning` rule requiring results from the
# CodeQL tool, but default setup never runs for pull requests from forks. Every
# fork PR therefore sat forever on "Code scanning is waiting for results from
# CodeQL", with no run to approve and no result ever arriving — see #177 and
# #158. An advanced workflow runs in the `pull_request` context like any other
# workflow, so fork PRs get analyzed once a maintainer approves the run.
#
# Second reason: default setup was configured for `actions` only, so CodeQL had
# never looked at a line of the Rust. This adds `rust` alongside it.
#
# IMPORTANT: default setup must be disabled (Settings → Code security → CodeQL
# analysis → default setup) before this workflow can upload. While it is still
# enabled, the analyze step fails because GitHub refuses advanced-configuration
# results for a repo using default setup.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The ruleset gates merges on code scanning, so the analysis has to report in
  # the merge queue's temporary ref too — otherwise queued entries wait out the
  # 60-minute timeout and fail to merge. Same reasoning as ci.yaml.
  merge_group:
  # Keeps the weekly cadence the default setup had, so main is still rescanned
  # when new queries ship rather than only when someone opens a PR.
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Uploading the SARIF results.
      security-events: write
      # The `actions` extractor reads workflow definitions and run metadata.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        # `actions` just parses workflow YAML — nothing to build.
        #
        # `none` is the only build mode the Rust extractor accepts —
        # `autobuild` is rejected outright ("Rust does not support the
        # autobuild build mode"). It extracts 35 of 41 files with errors,
        # which is exactly what the repository's default setup produces
        # today, so this is not a regression — but treat Rust findings as
        # best-effort until the extractor improves. Pre-fetching crate
        # sources (`cargo fetch`) was measured and changed nothing.
        #
        # Rust is left out in the merge queue. The ruleset's `code_scanning`
        # rule only needs *a* CodeQL result on the queue's temporary ref, and
        # `actions` produces one in ~40s. Rust takes ~4.5 minutes — longer
        # than the entry survives — so by upload time GitHub has already
        # merged it and deleted `refs/heads/gh-readonly-queue/main/pr-N-...`,
        # and the SARIF upload 404s ("ref ... not found in this repository"),
        # failing the job. Every merge_group run whose Rust analysis ran past
        # ~4 minutes has died this way since #200. Rust is still analyzed on
        # every pull_request, on every push to main, and on the weekly
        # schedule, so nothing goes unscanned.
        include: >-
          ${{ github.event_name == 'merge_group'
          && fromJSON('[{"language":"actions","build-mode":"none"}]')
          || fromJSON('[{"language":"actions","build-mode":"none"},{"language":"rust","build-mode":"none"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # ratchet:github/codeql-action/init@v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # Matches the `extended` query suite the default setup used, so this
          # swap does not quietly narrow what gets flagged.
          queries: security-extended
          # Deliberately no `config-file:`. The recurring false positives are
          # 30 `rust/log-injection` alerts whose source AND sink both sit inside
          # the `#[cfg(test)] mod tests` at the bottom of src/proxy.rs (a
          # TcpStream the test opened to a listener it spawned in-process,
          # reported at an `assert!` message), plus one `rust/cleartext-logging`
          # for the scratch session id, reported at src/ui.rs:96 — the shared
          # `ui::ok` eprintln. `paths-ignore` filters whole FILES, never a
          # module inside one, so the only patterns that would silence these are
          # `src/proxy.rs` and `src/ui.rs` — which would blind CodeQL to the
          # CONNECT proxy and to every output helper, exactly the code worth
          # scanning. `query-filters` is no better: it drops a query repo-wide,
          # and rust/log-injection has already earned its keep here (a real
          # ESC-injection sink in `log_connection`). Test-code alerts are
          # dismissed as "used in tests" in the security tab instead.
          #
          # Same treatment for the three `rust/cleartext-logging` alerts on
          # `git::trusted_git()` / `git::trusted_binary()` (#236). The values
          # are `TRUSTED_BIN_DIRS` entries joined with a literal binary name —
          # `/usr/bin/git`, `/usr/bin/bwrap` — with no env var, config value or
          # user input anywhere in the flow, and `find_in` refuses any `name`
          # that is not a bare path component. What trips the query is the
          # *name*: CodeQL's shared sensitive-data heuristic classifies anything
          # matching `(?<!un|un_|is|is_)trusted(?!_iter)` as
          # `SensitiveDataClassification::secret()` — its own docs call that
          # "generic secret or trusted data". `trusted_git`, `trusted_binary`
          # and `TRUSTED_BIN_DIRS` all match, so every path they produce is
          # treated as secret material at any log sink. The lookbehind exempts
          # only `untrusted`/`is_trusted`; there is no spelling of "resolved
          # from a trusted directory" that keeps the meaning and dodges the
          # regex. Dismiss as "false positive".

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # ratchet:github/codeql-action/analyze@v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
