name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Determine version
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      title: ${{ steps.ver.outputs.title }}
      sha: ${{ steps.ver.outputs.sha }}
    steps:
      - name: Compute version
        id: ver
        run: |
          COMMIT_SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          VERSION="$(date -u +%Y.%m.%d-%H%M%S)-${SHORT_SHA}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "title=cplt ${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
          targets: ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # ratchet:actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-${{ matrix.target }}-

      - name: Build release binary
        run: |
          CPLT_LONG_VERSION="${{ needs.version.outputs.version }}" cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../cplt-${{ matrix.target }}.tar.gz cplt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # ratchet:actions/attest-build-provenance@v4
        with:
          subject-path: cplt-${{ matrix.target }}.tar.gz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # ratchet:actions/upload-artifact@v7.0.1
        with:
          name: cplt-${{ matrix.target }}
          path: cplt-${{ matrix.target }}.tar.gz

  release:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # ratchet:actions/download-artifact@v8.0.1
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum cplt-* > SHA256SUMS
          cat SHA256SUMS

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -1 || echo "")
          TAG="${{ needs.version.outputs.tag }}"
          {
            echo "body<<RELEASE_EOF"
            echo "## cplt"
            echo ""
            echo "Sandbox wrapper for GitHub Copilot CLI."
            echo ""
            echo "- **macOS**: Seatbelt/SBPL via sandbox-exec"
            echo "- **Linux**: Landlock LSM + seccomp-BPF (kernel 5.13+)"
            echo ""
            echo "### Installation"
            echo ""
            echo '```bash'
            echo "# macOS — Apple Silicon (M1/M2/M3/M4)"
            echo "curl -fsSL https://github.com/navikt/cplt/releases/download/${TAG}/cplt-aarch64-apple-darwin.tar.gz | tar xz"
            echo ""
            echo "# macOS — Intel"
            echo "curl -fsSL https://github.com/navikt/cplt/releases/download/${TAG}/cplt-x86_64-apple-darwin.tar.gz | tar xz"
            echo ""
            echo "# Linux — x86_64"
            echo "curl -fsSL https://github.com/navikt/cplt/releases/download/${TAG}/cplt-x86_64-unknown-linux-gnu.tar.gz | tar xz"
            echo ""
            echo "# Linux — ARM64"
            echo "curl -fsSL https://github.com/navikt/cplt/releases/download/${TAG}/cplt-aarch64-unknown-linux-gnu.tar.gz | tar xz"
            echo '```'
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "### Changes since ${PREV_TAG##*/}"
              echo ""
              git log --oneline "${PREV_TAG}..HEAD" | head -20
            else
              echo "### Initial release"
            fi
            echo ""
            echo "RELEASE_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # ratchet:softprops/action-gh-release@v3.0.1
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ needs.version.outputs.sha }}
          name: ${{ needs.version.outputs.title }}
          body: ${{ steps.notes.outputs.body }}
          make_latest: true
          files: |
            artifacts/cplt-*
            artifacts/SHA256SUMS
