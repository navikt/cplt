# SPIKE #114 (do not merge)
name: spike-114-netns
on:
  push:
    branches: [spike/114-netns]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # ratchet:dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94"
      - name: Install bubblewrap
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version; uname -r
          echo "raw unshare-net:"; bwrap --unshare-user --unshare-net --ro-bind / / --proc /proc --dev /dev ip -br addr
      - run: cargo build --release
      - run: bash .github/spike/netns114.sh
