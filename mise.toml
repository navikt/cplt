[tools]
rust = "1.94"

[vars]
release_targets = "x86_64-apple-darwin aarch64-apple-darwin x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu"

[tasks.version]
description = "Generate version string (YYYY.MM.DD-HHMMSS-gitsha)"
run = "echo $(date -u +%Y.%m.%d-%H%M%S)-$(git rev-parse --short HEAD)"

[tasks.fmt]
description = "Format code with rustfmt"
run = "cargo fmt"

[tasks."fmt:check"]
description = "Check code formatting"
run = "cargo fmt -- --check"

[tasks.clippy]
description = "Run Clippy linter"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.build]
description = "Build debug binary"
run = """
export CPLT_LONG_VERSION="$(date -u +%Y.%m.%d-%H%M%S)-$(git rev-parse --short HEAD 2>/dev/null || echo unknown)$(git diff --quiet HEAD 2>/dev/null || echo '-dirty')"
cargo build
"""

[tasks."build:release"]
description = "Build optimized release binary"
run = """
export CPLT_LONG_VERSION="$(date -u +%Y.%m.%d-%H%M%S)-$(git rev-parse --short HEAD 2>/dev/null || echo unknown)$(git diff --quiet HEAD 2>/dev/null || echo '-dirty')"
cargo build --release
"""

[tasks."build:setup-targets"]
description = "Add all release targets via rustup"
run = """
for t in {{vars.release_targets}}; do
  rustup target add "$t"
done
"""

[tasks."check:all-targets"]
description = "Run cargo check for all release targets"
depends = ["build:setup-targets"]
run = """
for t in {{vars.release_targets}}; do
  cargo check --target "$t"
done
"""

[tasks.test]
description = "Run all tests (same as cargo test; macOS only)"
run = "cargo test"

[tasks."test:lib"]
description = "Run library crate tests — cross-platform, sandbox-safe"
run = "cargo test --lib"

[tasks."test:unit"]
description = "Run unit tests — cross-platform, sandbox-safe"
run = "cargo test --test unit_tests"

[tasks."test:integration"]
description = "Run integration tests — macOS only, sandbox-safe"
run = "cargo test --test integration"

[tasks."test:integration-linux"]
description = "Run Linux Landlock integration tests — Linux only (kernel 5.13+)"
run = "cargo test --test integration_linux"

[tasks."test:e2e"]
description = "Run E2E tests — macOS only, sandbox-safe"
run = "cargo test --test e2e"

[tasks."test:e2e-projects"]
description = "Run E2E project scaffold tests — macOS only, sandbox-safe"
run = "cargo test --test e2e_projects"

[tasks."test:e2e-live"]
description = "Run live smoke tests — macOS only, requires Copilot auth + network, NOT sandbox-safe"
run = "cargo test --test e2e -- --ignored"

[tasks."test:all"]
description = "Run all test suites except live smoke tests — macOS only, sandbox-safe"
depends = ["test:unit", "test:lib", "test:integration", "test:e2e", "test:e2e-projects"]

[tasks."test:everything"]
description = "Run ALL tests including live smoke tests — macOS only, NOT sandbox-safe"
depends = ["test:all", "test:e2e-live"]

[tasks.check]
description = "Run all checks (fmt, clippy, test) — works inside sandbox"
depends = ["fmt:check", "clippy", "test:unit", "test:lib"]

[tasks.all]
description = "Run all checks and build release"
depends = ["check", "check:all-targets", "build:release"]

[tasks.install]
description = "Build and install cplt to /usr/local/bin"
run = """
export CPLT_LONG_VERSION="$(date -u +%Y.%m.%d-%H%M%S)-$(git rev-parse --short HEAD 2>/dev/null || echo unknown)$(git diff --quiet HEAD 2>/dev/null || echo '-dirty')"
cargo build --release
sudo cp target/release/cplt /usr/local/bin/cplt
if [[ "$(uname)" == "Darwin" ]]; then
  sudo /usr/bin/xattr -cr /usr/local/bin/cplt
  sudo codesign --force --sign - /usr/local/bin/cplt
fi
"""

[tasks.clean]
description = "Clean build artifacts"
run = "cargo clean"

[tasks.run]
description = "Build and run copilot --version inside sandbox"
run = "cargo run -- -- --version"

[tasks.setup-hooks]
description = "Install git pre-commit hook"
run = "git config core.hooksPath hack && echo 'Git hooks path set to hack/.'"
